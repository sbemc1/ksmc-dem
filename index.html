<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<base target="_blank">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f5c6e; --onbg:#ffffff; --onbg-muted:rgba(255,255,255,.75);
    --card:#ffffff; --ink:#14212b; --muted:#5f6f7c; --line:#e1e6eb;
    --brand:#0f5c6e; --brand-soft:#e3f0f2; --accent:#c8553d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b3a45; --card:#161f25; --ink:#e7eef2; --muted:#93a3ae; --line:#26323a;
      --brand:#5fb3c4; --brand-soft:#17303a; --accent:#e07a5f;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.55}
  a{color:inherit;text-decoration:none}

  /* section colours */
  /* section colours — change the hex codes here */
  [data-sec=lib]{--c:#1b7f95}    /* Medical Library */
  [data-sec=admin]{--c:#c8553d}  /* Rotation Requirements */
  [data-sec=links]{--c:#3d6fc8}  /* Important Links */
  [data-sec=req]{--c:#7a4fb0}    /* Level Requirements */
  [data-sec=apps]{--c:#2f8f5b}   /* Useful Apps */
  [data-sec=staff]{--c:#b58a1f}  /* Staff Directory */
  body[data-sec]{--brand:var(--c);--brand-soft:color-mix(in srgb,var(--c) 12%,var(--card))}
  @media (prefers-color-scheme: dark){
    body[data-sec]{--brand:color-mix(in srgb,var(--c) 60%,#fff);--brand-soft:color-mix(in srgb,var(--c) 28%,var(--card))}
  }

  header{background:var(--bg);color:var(--onbg);padding:20px 16px 4px}
  .top{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .back{display:none;flex:0 0 38px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.18);
    color:var(--onbg);font-weight:700;font-size:20px;line-height:1;cursor:pointer}
  body[data-sec] .back{display:block}
  .title{font-size:20px;font-weight:700;margin:0}
  .sub{color:var(--onbg-muted);font-size:13px;margin:2px 0 0}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{border:0;border-radius:16px;padding:16px 14px;min-height:122px;display:flex;flex-direction:column;
    justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;background:var(--c);
    font:inherit;cursor:pointer;transition:transform .12s}
  .tile:active{transform:scale(.97)}
  .tile.soon{background:rgba(255,255,255,.1);color:var(--onbg-muted);border:1px dashed rgba(255,255,255,.35);cursor:default}
  .tile.soon .i{background:rgba(255,255,255,.12);color:var(--onbg-muted)}
  .tile.soon:active{transform:none}
  a.tile{text-decoration:none}
  .tile .i{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
  .tile b{font-size:15px;display:block}
  .tile small{font-size:12px;opacity:.85}
  svg.s{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ftile{min-height:104px}
  .ftile b{font-size:14px;overflow-wrap:anywhere}
  .tag{flex:0 0 auto;font-size:11px;font-weight:600;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px}

  main{max-width:960px;margin:0 auto;padding:16px}
  .section{display:none}
  .section.on{display:block}

  .group{margin:0 0 20px}
  .group h3{font-size:13px;font-weight:600;color:var(--onbg-muted);margin:0 0 8px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:56px}
  .row:first-child{border-top:0}
  .row.click{cursor:pointer}
  .row.click:hover{background:var(--brand-soft)}
  .ic{flex:0 0 36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .tx{flex:1;min-width:0}
  .nm{font-weight:600;overflow-wrap:anywhere}
  .nt{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .go{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--brand);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;background:transparent;font-family:inherit;cursor:pointer}
  .go:disabled{opacity:.5}
  a.row{color:inherit}
  a.row:hover{background:var(--brand-soft)}
  .ic.t{color:#fff}
  .ic.t svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ic img{width:36px;height:36px;border-radius:9px;object-fit:cover;display:block}
  .chev{flex:0 0 auto;color:var(--muted);font-size:20px;line-height:1}
  .due{flex:0 0 auto;font-size:12px;color:var(--accent);font-weight:600}

  .tools{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:10px 12px;font:inherit}
  .crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;margin:0 0 10px;color:var(--onbg-muted)}
  .crumbs a{color:var(--onbg);font-weight:600;cursor:pointer}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--onbg);border-radius:999px;
    padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--card);border-color:var(--card);color:var(--bg)}
  .meta{font-size:12px;color:var(--onbg-muted);margin-top:10px}
  .empty{padding:28px 14px;text-align:center;color:var(--muted)}
  .loading{padding:40px;text-align:center;color:var(--onbg-muted)}
  footer{max-width:960px;margin:0 auto;padding:28px 16px 32px;display:flex;justify-content:center}
  .maker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;
    background:rgba(255,255,255,.1);color:var(--onbg-muted);font-size:12px;font-weight:600;letter-spacing:.2px}
  .maker svg{width:18px;height:18px}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M8 7h7"/></symbol>
  <symbol id="i-admin" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
  <symbol id="i-links" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-req" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 2 2 4-4M8 16h8"/></symbol>
  <symbol id="i-apps" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
  <symbol id="t-form" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 2 2 4-4M8 16h8"/></symbol>
  <symbol id="t-sheet" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v17M3 15h18"/></symbol>
  <symbol id="t-drive" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="t-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="ma-logo" viewBox="16 12 128 132"><path d="M32 128V40L80 92L128 40V128" fill="none" stroke="#F3EBD3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M69 124L80 110L91 124" fill="none" stroke="#C9A227" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-staff" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20a6 6 0 0 0-4-5.6"/></symbol>
</svg>

<header>
  <div class="top">
    <button class="back" id="back" aria-label="Back">&#8592;</button>
    <div>
      <p class="title" id="title">KSMC DEM Residents</p>
      <p class="sub" id="sub">Department of Emergency Medicine — King Saud Medical City</p>
    </div>
  </div>
</header>

<main>
  <div id="loading" class="loading">Loading…</div>
  <section id="s-home" class="section">
    <div class="tools"><input class="search" id="gq" placeholder="Search all sections"></div>
    <div id="grid" class="grid"></div>
    <div id="gres"></div>
  </section>
  <section id="s-lib" class="section"></section>
  <section id="s-admin" class="section"></section>
  <section id="s-links" class="section"></section>
  <section id="s-req" class="section"></section>
  <section id="s-apps" class="section"></section>
  <section id="s-staff" class="section"></section>
</main>

<footer><span class="maker"><svg><use href="#ma-logo"/></svg>by MA Solution</span></footer>

<script>
/* ================================================================
   DATA SOURCE
   Empty = the page uses the built-in content below (edit it here).
   Later: paste the Apps Script web app URL (ends with /exec) between the
   quotes and the content comes from the Google Sheet instead.
   ================================================================ */
const API_URL = '';

/* ---------- Data loading: API (GitHub Pages) / Apps Script / sample ---------- */
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
if (!API_URL && !IN_GAS) {
  const DATA = {
    lib: [],
    admin: [],
    links: [['Forms', 'Academic Activity', 'https://forms.gle/zS4XApNUs6M7oioXA', ''],
      ['Forms', 'Shift evaluation', 'https://docs.google.com/forms/d/1hwjZwAztvlxZC-qMB835dYU_PVycOXR9nd9-EZgv8fM/edit', ''],
      ['Forms', 'Morning meeting', 'https://docs.google.com/forms/d/e/1FAIpQLSfgUW9Kg7HikfbSrmMdyw4oC6kLqbKDOkjq8VbkxUp_BxxhOA/viewform', ''],
      ['Forms', 'Shift swap', 'https://forms.gle/4JHfVUA5PeBCTnST6', ''],
      ['Schedules', 'Schedule (Rota)', 'https://docs.google.com/spreadsheets/d/1VgzHn4Ftop_K-0blDAa88C7q57fpB8nNO-_CA-14KuM/htmlview', ''],
      ['Schedules', 'Activity dates (AY 26/27)', 'https://docs.google.com/spreadsheets/d/17AEmetNLAsY7GwqIdepWBZQijt4zXbq2cqpUZyRj1yo/htmlview', ''],
      ['Schedules', 'Master rota', 'https://docs.google.com/spreadsheets/d/1Cu_7XOCp-QxwG2yxHZd_vNu-Tlzezo13La2FFGIjvg4/htmlview', '']],
    req: [],
    apps: [['Calculators', 'MDCalc Medical Calculator', 'https://apps.apple.com/sa/app/id1001640662', 'All the scores, add them to favorites'],
      ['Resuscitation', 'EZResus', 'https://apps.apple.com/sa/app/id1667317861', 'Doses and sizes for everything, especially pediatrics'],
      ['Ultrasound', 'RESUS Ultrasound', 'https://apps.apple.com/sa/app/id1033017112', 'Quick images and the correct location for everything'],
      ['Ultrasound', 'POCUS 101', 'https://apps.apple.com/sa/app/id1578751657', 'Tutorials, open the free tutorial, no account needed'],
      ['References', 'CorePendium', 'https://apps.apple.com/sa/app/id1581291387', 'Subscription, one shared account'],
      ['References', 'EM:RAP', 'https://apps.apple.com/sa/app/id804248260', 'Podcast, included with CorePendium'],
      ['References', 'Eolas Medical', 'https://apps.apple.com/sa/app/id6447954935', 'WikEM, free'],
      ['Question bank', 'Rosh Review', 'https://apps.apple.com/sa/app/id991352355', 'MCQs, subscription, one shared account'],
      ['Websites', 'ECG Library (LITFL)', 'https://litfl.com/ecg-library/', 'Best site to study ECG'],
      ['Schedule', 'Supershift', 'https://apps.apple.com/sa/app/id1104165041', 'Shift planning and study plan']],
    staff: [],
    code: 'kZrUYU0ZYRrNCdbAOtmHrP6R8m1STLP1ENSk', drive: 'https://drive.google.com/drive/folders/1XDHms-PDvvld8_U3PFA3psb_OCYHyD58', host: '', updated: ''
  };
  window.__DATA = DATA;
}
function loadData(ok, fail) {
  if (API_URL) return fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=data').then(r => r.json()).then(ok).catch(fail);
  if (IN_GAS) return google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getData();
  setTimeout(() => ok(window.__DATA), 0);
}
function downloadUrl(fileid, ok, fail) {
  if (API_URL) return fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'action=download&fileid=' + encodeURIComponent(fileid))
    .then(r => r.json()).then(j => j.url ? ok(j.url) : fail()).catch(fail);
  if (IN_GAS) return google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getDownloadUrl(fileid);
  fail();
}
/* history: works both on GitHub Pages and inside Apps Script */
const hist = IN_GAS && google.script.history
  ? { push: s => google.script.history.push({ s }, { s }), on: f => google.script.history.setChangeHandler(e => f((e.state && e.state.s) || '')) }
  : { push: s => history.pushState({ s }, '', s ? '#' + s : location.pathname), on: f => addEventListener('popstate', e => f((e.state && e.state.s) || '')) };

let D = null, libPath = '', libQuery = '', reqLevel = 'All', staffHosp = 'All', staffQuery = '';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u).trim()) ? String(u).trim() : '';
const empty = () => '<div class="list"><div class="empty">Nothing here yet</div></div>';

/* ---------- Home / navigation ---------- */
const SECS = [
  { id: 'lib',   name: 'Medical Library' },
  { id: 'admin', name: 'Rotation Requirements' },
  { id: 'links', name: 'Important Links' },
  { id: 'req',   name: 'Level Requirements' },
  { id: 'apps',  name: 'Useful Apps' },
  { id: 'staff', name: 'Staff Directory' }
];
const secName = id => (SECS.find(x => x.id === id) || {}).name || '';

function show(id) {
  if (id) document.body.dataset.sec = id; else delete document.body.dataset.sec;
  document.querySelectorAll('.section').forEach(x => x.classList.toggle('on', x.id === 's-' + (id || 'home')));
  document.getElementById('title').textContent = id ? secName(id) : 'KSMC DEM Residents';
  document.getElementById('sub').textContent = id ? 'KSMC DEM Residents' : 'Department of Emergency Medicine — King Saud Medical City';
  window.scrollTo(0, 0);
}
function open_(id) { hist.push(id); show(id); }
document.getElementById('back').onclick = () => { hist.push(''); show(''); };
hist.on(show);

function countLabel(id) {
  const n = id === 'lib' ? D.lib.filter(r => r[2] !== '1').length : D[id].length;
  if (id === 'req') { const lv = [...new Set(D.req.map(r => r[0]).filter(Boolean))]; return lv.length ? lv.join(' · ') : '—'; }
  if (id === 'staff') { const h = new Set(D.staff.map(r => r[0]).filter(Boolean)).size; return n ? n + ' staff · ' + h + ' hospitals' : '—'; }
  const w = { lib: 'file', admin: 'file', links: 'link', apps: 'app' }[id];
  return n ? n + ' ' + w + (n === 1 ? '' : 's') : '—';
}

function renderHome() {
  const pcloud = D.code ? 'https://u.pcloud.link/publink/show?code=' + encodeURIComponent(D.code) : '';
  const direct = { lib: [pcloud, 'pCloud'], admin: [safeUrl(D.drive), 'Google Drive'] };
  const soon = ['req', 'staff'];
  document.getElementById('grid').innerHTML = SECS.map(x => soon.includes(x.id) ? `
    <div class="tile soon" data-sec="${x.id}">
      <div class="i"><svg class="s"><use href="#i-${x.id}"/></svg></div>
      <div><b>${esc(x.name)}</b><small>Coming soon</small></div>
    </div>` : direct[x.id] && direct[x.id][0] ? `
    <a class="tile" data-sec="${x.id}" href="${esc(direct[x.id][0])}" rel="noopener">
      <div class="i"><svg class="s"><use href="#i-${x.id}"/></svg></div>
      <div><b>${esc(x.name)}</b><small>${direct[x.id][1]}</small></div>
    </a>` : `
    <button class="tile" data-sec="${x.id}" data-go="${x.id}">
      <div class="i"><svg class="s"><use href="#i-${x.id}"/></svg></div>
      <div><b>${esc(x.name)}</b><small>${esc(countLabel(x.id))}</small></div>
    </button>`).join('');
  document.querySelectorAll('[data-go]').forEach(t => t.onclick = () => open_(t.dataset.go));
  document.getElementById('gq').oninput = e => globalSearch(e.target.value.trim());
}

const soonSkip = true;
function globalSearch(q) {
  const grid = document.getElementById('grid'), out = document.getElementById('gres');
  if (!q) { grid.style.display = ''; out.innerHTML = ''; return; }
  grid.style.display = 'none';
  const k = q.toLowerCase(), has = arr => arr.join(' ').toLowerCase().includes(k), res = [];
  D.lib.forEach(r => { if (r[2] !== '1' && r[1].toLowerCase().includes(k)) res.push({ s: 'lib', n: r[1], t: r[0], f: r[3] }); });
  ['admin', 'links', 'apps'].forEach(s => D[s].forEach(r => { if (has([r[0], r[1], r[3]])) res.push({ s, n: r[1], t: r[3] || r[0], u: safeUrl(r[2]) }); }));
  if (!soonSkip) D.req.forEach(r => { if (has(r.slice(0, 3))) res.push({ s: 'req', n: r[1], t: [r[0], r[3]].filter(Boolean).join(' · '), u: safeUrl(r[4]) }); });
  if (!soonSkip) D.staff.forEach(r => { if (has(r.slice(0, 4))) res.push({ s: 'staff', n: r[1], t: [r[3], r[2], r[0]].filter(Boolean).join(' · '), tel: String(r[4]).replace(/[^\d+]/g, ''), p: r[4] }); });
  out.innerHTML = '<div class="list">' + (res.slice(0, 80).map(x => `
    <div class="row">
      <span class="tag" data-sec="${x.s}">${esc(secName(x.s))}</span>
      <div class="tx"><div class="nm">${esc(x.n)}</div>${x.t ? `<div class="nt">${esc(x.t)}</div>` : ''}</div>
      ${x.f ? `<button class="go" data-f="${esc(x.f)}">Download</button>` : ''}
      ${x.u ? `<a class="go" href="${esc(x.u)}" rel="noopener">Open</a>` : ''}
      ${x.tel ? `<a class="go" href="tel:${esc(x.tel)}" target="_top" dir="ltr">${esc(x.p)}</a>` : ''}
    </div>`).join('') || '<div class="empty">No results</div>') + '</div>';
  out.querySelectorAll('[data-f]').forEach(b => b.onclick = () => download(b));
}

/* ---------- Important Links (tappable rows, icon by type) ---------- */
function linkType(u) {
  u = String(u).toLowerCase();
  if (/forms\.gle|docs\.google\.com\/forms/.test(u)) return ['form', 'Google Form', '#7a4fb0'];
  if (/docs\.google\.com\/spreadsheets/.test(u)) return ['sheet', 'Google Sheet', '#2f8f5b'];
  if (/drive\.google\.com/.test(u)) return ['drive', 'Google Drive', '#e0a100'];
  const m = u.match(/^https?:\/\/([^/]+)/); return ['link', m ? m[1].replace(/^www\./, '') : '', '#3d6fc8'];
}
function renderLinks() {
  const el = document.getElementById('s-links'), rows = D.links;
  if (!rows.length) { el.innerHTML = empty(); return; }
  const groups = {};
  rows.forEach(r => { const g = r[0] || 'General'; (groups[g] = groups[g] || []).push(r); });
  el.innerHTML = Object.keys(groups).map(g => `
    <div class="group"><h3>${esc(g)}</h3><div class="list">
      ${groups[g].map(r => {
        const url = safeUrl(r[2]), t = linkType(url);
        return `<a class="row" href="${esc(url || '#')}" rel="noopener">
          <div class="ic t" style="background:${t[2]}"><svg><use href="#t-${t[0]}"/></svg></div>
          <div class="tx"><div class="nm">${esc(r[1])}</div><div class="nt">${esc(r[3] || t[1])}</div></div>
          <span class="chev">›</span>
        </a>`;
      }).join('')}
    </div></div>`).join('');
}

/* ---------- Useful Apps (logo rows) ---------- */

function renderApps() {
  const el = document.getElementById('s-apps'), rows = D.apps;
  if (!rows.length) { el.innerHTML = empty(); return; }
  const groups = {};
  rows.forEach(r => { const g = r[0] || 'General'; (groups[g] = groups[g] || []).push(r); });
  el.innerHTML = Object.keys(groups).map(g => `
    <div class="group"><h3>${esc(g)}</h3><div class="list">
      ${groups[g].map(r => {
        const url = safeUrl(r[2]), icon = LOGOS[String(r[1]).trim()] || safeUrl(r[4]);
        const letter = esc(String(r[1]).trim().charAt(0).toUpperCase());
        const m = url.match(/apps\.apple\.com\/.*\/id(\d+)/);
        const host = url ? url.replace(/^https?:\/\//i, '').split('/')[0] : '';
        const auto = !icon && !m && host ? 'https://www.google.com/s2/favicons?sz=128&domain=' + host : '';
        return `<a class="row" href="${esc(url || '#')}" rel="noopener">
          <div class="ic" ${!icon && m ? `data-appid="${m[1]}"` : ''}>${(icon || auto) ? `<img src="${esc(icon || auto)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${letter}'))">` : letter}</div>
          <div class="tx"><div class="nm">${esc(r[1])}</div>${r[3] ? `<div class="nt">${esc(r[3])}</div>` : ''}</div>
          <span class="chev">›</span>
        </a>`;
      }).join('')}
    </div></div>`).join('');
  fetchAppIcons();
}

/* Logos not yet in the sheet: ask Apple directly from the browser (JSONP) */
function fetchAppIcons() {
  const nodes = [...document.querySelectorAll('#s-apps [data-appid]')];
  if (!nodes.length) return;
  const cb = 'itunes_cb_' + Date.now();
  window[cb] = d => {
    (d.results || []).forEach(r => nodes.filter(n => n.dataset.appid == r.trackId).forEach(n => {
      if (!r.artworkUrl100) return;
      const img = new Image(); img.src = r.artworkUrl100; img.alt = '';
      img.onload = () => { n.textContent = ''; n.appendChild(img); };
    }));
    delete window[cb]; sc.remove();
  };
  const sc = document.createElement('script');
  sc.src = 'https://itunes.apple.com/lookup?country=sa&callback=' + cb + '&id=' + [...new Set(nodes.map(n => n.dataset.appid))].join(',');
  sc.onerror = () => { delete window[cb]; sc.remove(); };
  document.head.appendChild(sc);
}

/* ---------- Generic grouped list (admin) ---------- */
function grouped(rows, el, label) {
  if (!rows.length) { el.innerHTML = empty(); return; }
  const groups = {};
  rows.forEach(r => { const g = r[0] || 'General'; (groups[g] = groups[g] || []).push(r); });
  el.innerHTML = Object.keys(groups).map(g => `
    <div class="group"><h3>${esc(g)}</h3><div class="list">
      ${groups[g].map(r => {
        const url = safeUrl(r[2]);
        return `<div class="row">
          <div class="ic">${esc(label)}</div>
          <div class="tx"><div class="nm">${esc(r[1])}</div>${r[3] ? `<div class="nt">${esc(r[3])}</div>` : ''}</div>
          ${url ? `<a class="go" href="${esc(url)}" rel="noopener">Open</a>` : ''}
        </div>`;
      }).join('')}
    </div></div>`).join('');
}

/* ---------- Requirements ---------- */
function renderReq() {
  const el = document.getElementById('s-req');
  const rows = D.req;
  if (!rows.length) { el.innerHTML = empty(); return; }
  const levels = ['All'].concat([...new Set(rows.map(r => r[0] || 'General'))]);
  const shown = reqLevel === 'All' ? rows : rows.filter(r => (r[0] || 'General') === reqLevel);
  const groups = {};
  shown.forEach(r => { const g = r[0] || 'General'; (groups[g] = groups[g] || []).push(r); });
  el.innerHTML = `
    <div class="chips">${levels.map(l => `<button class="chip ${l === reqLevel ? 'on' : ''}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>
    ${Object.keys(groups).map(g => `
      <div class="group"><h3>${esc(g)}</h3><div class="list">
        ${groups[g].map(r => {
          const url = safeUrl(r[4]);
          return `<div class="row">
            <div class="ic">${esc(g).slice(0, 3)}</div>
            <div class="tx"><div class="nm">${esc(r[1])}</div>${r[2] ? `<div class="nt">${esc(r[2])}</div>` : ''}</div>
            ${r[3] ? `<div class="due">${esc(r[3])}</div>` : ''}
            ${url ? `<a class="go" href="${esc(url)}" rel="noopener">Open</a>` : ''}
          </div>`;
        }).join('')}
      </div></div>`).join('')}`;
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { reqLevel = c.dataset.l; renderReq(); });
}

/* ---------- Library ---------- */
const ext = n => { const m = String(n).match(/\.([a-z0-9]{1,5})$/i); return m ? m[1].toUpperCase() : 'FILE'; };
const size = b => { b = Number(String(b).replace(/[^\d]/g, '')) || 0; if (!b) return '';
  const u = ['B','KB','MB','GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const byName = (a, b) => a[1].localeCompare(b[1], 'en', { numeric: true });

function renderLib() {
  const el = document.getElementById('s-lib');
  const all = D.lib;
  if (!all.length) { el.innerHTML = empty(); return; }

  let items, crumbs = '';
  if (libQuery) {
    const q = libQuery.toLowerCase();
    items = all.filter(r => r[2] !== '1' && r[1].toLowerCase().includes(q)).sort(byName).slice(0, 200);
  } else {
    items = all.filter(r => r[0] === libPath);
    items = items.filter(r => r[2] === '1').sort(byName).concat(items.filter(r => r[2] !== '1').sort(byName));
    const parts = libPath ? libPath.split('/') : [];
    crumbs = `<div class="crumbs"><a data-p="">Library</a>${parts.map((p, i) =>
      ` / <a data-p="${esc(parts.slice(0, i + 1).join('/'))}">${esc(p)}</a>`).join('')}</div>`;
  }

  const atRoot = !libQuery && !libPath;
  const countIn = p => all.filter(r => r[2] !== '1' && (r[0] === p || r[0].startsWith(p + '/'))).length;
  let tiles = '';
  if (atRoot) {
    const folders = items.filter(r => r[2] === '1');
    tiles = folders.length ? '<div class="grid" style="margin:0 0 16px">' + folders.map((r, i) => `
      <button class="tile ftile" data-p="${esc(r[1])}">
        <div class="i"><svg class="s"><use href="#i-lib"/></svg></div>
        <div><b>${esc(r[1])}</b><small>${countIn(r[1])} files</small></div>
      </button>`).join('') + '</div>' : '';
    items = items.filter(r => r[2] !== '1');
    crumbs = '';
  }

  const rows = items.map(r => {
    if (r[2] === '1') {
      const p = r[0] ? r[0] + '/' + r[1] : r[1];
      return `<div class="row click" data-p="${esc(p)}"><div class="ic">📁</div>
        <div class="tx"><div class="nm">${esc(r[1])}</div></div></div>`;
    }
    return `<div class="row"><div class="ic">${esc(ext(r[1]))}</div>
      <div class="tx"><div class="nm">${esc(r[1])}</div>
      <div class="nt">${esc([libQuery ? r[0] : '', size(r[4])].filter(Boolean).join(' · '))}</div></div>
      <button class="go" data-f="${esc(r[3])}">Download</button></div>`;
  }).join('');

  el.innerHTML = `
    <div class="tools"><input class="search" id="q" placeholder="Search the library" value="${esc(libQuery)}"></div>
    ${crumbs}
    ${tiles}
    ${rows || !tiles ? `<div class="list">${rows || '<div class="empty">No results</div>'}</div>` : ''}
    ${D.updated ? `<div class="meta">Last update: ${esc(D.updated)}</div>` : ''}`;

  const q = el.querySelector('#q');
  q.oninput = () => { libQuery = q.value.trim(); renderLib(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelectorAll('[data-p]').forEach(a => a.onclick = () => { libPath = a.dataset.p; libQuery = ''; renderLib(); });
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => download(b));
}

async function download(btn) {
  const win = window.open('', '_blank');
  btn.disabled = true; btn.textContent = '…';
  const done = url => { btn.disabled = false; btn.textContent = 'Download'; if (win) win.location = url; else location.href = url; };
  const fail = () => { btn.disabled = false; btn.textContent = 'Download'; if (win) win.close(); alert('Download failed, please try again'); };
  try {
    const r = await fetch(`${D.host}/getpublinkdownload?code=${encodeURIComponent(D.code)}&fileid=${encodeURIComponent(btn.dataset.f)}&forcedownload=1`).then(x => x.json());
    if (r.result === 0) return done('https://' + r.hosts[0] + r.path);
    throw 0;
  } catch (e) {
    downloadUrl(btn.dataset.f, done, fail);
  }
}

/* ---------- Staff ---------- */
const HOSP_ORDER = ['ksmc', 'king salman', 'imam faisal', 'eman'];
const hospRank = h => { const i = HOSP_ORDER.findIndex(k => String(h).toLowerCase().includes(k)); return i < 0 ? 99 : i; };

function renderStaff() {
  const el = document.getElementById('s-staff');
  const rows = D.staff;
  if (!rows.length) { el.innerHTML = empty(); return; }
  const hosps = [...new Set(rows.map(r => r[0] || 'Other'))].sort((a, b) => hospRank(a) - hospRank(b));
  const q = staffQuery.toLowerCase();
  const shown = rows.filter(r => (staffHosp === 'All' || (r[0] || 'Other') === staffHosp) &&
    (!q || r.slice(1).join(' ').toLowerCase().includes(q)));
  const groups = {};
  shown.forEach(r => { const g = r[0] || 'Other'; (groups[g] = groups[g] || []).push(r); });
  const list = Object.keys(groups).sort((a, b) => hospRank(a) - hospRank(b)).map(g => `
    <div class="group"><h3>${esc(g)}</h3><div class="list">
      ${groups[g].map(r => {
        const tel = String(r[4]).replace(/[^\d+]/g, '');
        return `<div class="row">
          <div class="ic">${esc(String(r[1]).trim().replace(/^dr\.?\s*/i, '').charAt(0))}</div>
          <div class="tx"><div class="nm">${esc(r[1])}</div>
            <div class="nt">${esc([r[3], r[2]].filter(Boolean).join(' · '))}</div></div>
          ${tel ? `<a class="go" href="tel:${esc(tel)}" target="_top" dir="ltr">${esc(r[4])}</a>` : ''}
        </div>`;
      }).join('')}
    </div></div>`).join('');
  el.innerHTML = `
    <div class="tools"><input class="search" id="sq" placeholder="Search by name or specialty" value="${esc(staffQuery)}"></div>
    <div class="chips">${['All'].concat(hosps).map(h => `<button class="chip ${h === staffHosp ? 'on' : ''}" data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div>
    ${list || '<div class="list"><div class="empty">No results</div></div>'}`;
  const sq = el.querySelector('#sq');
  sq.oninput = () => { staffQuery = sq.value.trim(); renderStaff(); const n = document.getElementById('sq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelectorAll('.chip').forEach(c => c.onclick = () => { staffHosp = c.dataset.h; renderStaff(); });
}

/* ---------- Load ---------- */
loadData(d => {
    D = d;
    document.getElementById('loading').remove();
    renderLib();
    grouped(D.admin, document.getElementById('s-admin'), 'File');
    renderLinks();
    renderReq();
    renderApps();
    renderStaff();
    renderHome();
    show('');
  }, () => { document.getElementById('loading').textContent = 'Could not load data'; });
</script>
